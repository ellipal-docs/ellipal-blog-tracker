<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELLIPAL Blog Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8F7F4;color:#1a1a1a;font-size:14px;}
.header{background:#fff;border-bottom:1px solid #E8E6E0;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.logo{font-size:15px;font-weight:600;letter-spacing:-.3px;}.logo span{color:#3B82F6;}
.updated{font-size:11px;color:#888;margin-top:2px;}
.main{padding:24px;}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.stat{background:#fff;border:1px solid #E8E6E0;border-radius:10px;padding:14px 16px;}
.stat-label{font-size:11px;color:#888;margin-bottom:6px;}
.stat-num{font-size:24px;font-weight:600;letter-spacing:-.5px;}
.cmd-bar{background:#fff;border:1px solid #E8E6E0;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;}
.cmd-bar-label{font-size:11px;font-weight:600;color:#888;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;}
.cmd-bar input{flex:1;font-size:12px;font-family:monospace;padding:6px 10px;border:1px solid #E0DED8;border-radius:6px;background:#F8F7F4;color:#1a1a1a;outline:none;}
.cmd-bar input:focus{border-color:#3B82F6;background:#fff;}
.cmd-bar button{font-size:12px;padding:6px 14px;border:1px solid #E0DED8;border-radius:6px;background:#fff;cursor:pointer;color:#1a1a1a;}
.cmd-bar button:hover{background:#F0EFEB;}
.cmd-status{font-size:11px;min-width:80px;}
.controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.controls input,.controls select{font-size:13px;padding:7px 12px;border:1px solid #E0DED8;border-radius:8px;background:#fff;color:#1a1a1a;height:36px;outline:none;}
.controls input{flex:1;min-width:180px;}
.legend{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#888;}
.diff-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.d-b{background:#22C55E;}.d-m{background:#A855F7;}.d-e{background:#F97316;}
.tbl-wrap{background:#fff;border:1px solid #E8E6E0;border-radius:10px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
th{text-align:left;padding:10px 12px;font-weight:500;font-size:11px;color:#888;border-bottom:1px solid #F0EFEB;background:#FAFAF8;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid #F5F4F0;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FAFAF8;}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500;white-space:nowrap;}
.b-published{background:#EAF3DE;color:#2E6B08;}.b-produced{background:#E6F1FB;color:#1254A0;}
.b-writing{background:#FFF3E0;color:#8B4B00;}.b-pending{background:#F3F2EE;color:#555;}
.b-covered{background:#F0EBFF;color:#5B21B6;}.b-reserve{background:#F3F2EE;color:#888;}
.pri-high{color:#92400E;font-weight:600;}.pri-mid{color:#555;}.pri-low{color:#999;}
.diff-b{color:#166534;}.diff-m{color:#6B21A8;}.diff-e{color:#C2410C;}
.url-input{font-size:11px;border:1px solid #E0DED8;border-radius:5px;padding:3px 7px;width:150px;background:#F8F7F4;color:#1a1a1a;outline:none;}
.url-input:focus{border-color:#3B82F6;background:#fff;}
.sec-row td{padding:0;border-bottom:1px solid #E8E6E0;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#F5F4F0;cursor:pointer;user-select:none;}
.sec-hdr:hover{background:#EEEDEA;}
.sec-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#444;}
.sec-meta{font-size:11px;color:#999;font-weight:400;}
.sec-chev{font-size:12px;color:#999;transition:transform .15s;}
.sec-chev.open{transform:rotate(180deg);}
.write-btn{font-size:11px;padding:2px 8px;border:1px solid #E0DED8;border-radius:5px;background:#fff;cursor:pointer;margin-top:3px;display:block;color:#1a1a1a;}
.write-btn:hover{background:#F0EFEB;}
.geo-val{font-weight:700;color:#1254A0;}
.footer{text-align:center;padding:20px;font-size:11px;color:#bbb;}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="logo">ELLIPAL <span>Blog Tracker</span></div>
    <div class="updated" id="updated-time"></div>
  </div>
  <div style="font-size:12px;color:#888" id="total-count"></div>
</div>
<div class="main">
  <div class="stats">
    <div class="stat"><div class="stat-label">📄 Total</div><div class="stat-num" id="s-total">—</div></div>
    <div class="stat"><div class="stat-label"><span style="color:#22C55E">●</span> Published</div><div class="stat-num" id="s-pub">0</div></div>
    <div class="stat"><div class="stat-label"><span style="color:#3B82F6">●</span> Produced</div><div class="stat-num" id="s-prod">0</div></div>
    <div class="stat"><div class="stat-label"><span style="color:#A855F7">●</span> Covered</div><div class="stat-num" id="s-cov">0</div></div>
    <div class="stat"><div class="stat-label">🔴 High-pri pending</div><div class="stat-num" id="s-hi">0</div></div>
  </div>
  <div class="cmd-bar">
    <span class="cmd-bar-label">Update</span>
    <input type="text" id="cmd" placeholder='Paste Claude update: {"id":"ED003","status":"produced","geo":92}' />
    <button onclick="runCmd()">Apply ↗</button>
    <span class="cmd-status" id="cmd-st"></span>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="🔍  Search title or ID…" oninput="render()" />
    <select id="f-status" onchange="render()">
      <option value="">All statuses</option>
      <option value="pending">待写</option>
      <option value="writing">写作中</option>
      <option value="produced">已产出</option>
      <option value="published">已发布</option>
      <option value="covered">已覆盖</option>
      <option value="reserve">储备</option>
    </select>
    <select id="f-cat" onchange="render()">
      <option value="">All categories</option>
      <option>Cold Wallet Basics</option>
      <option>Security &amp; Threats</option>
      <option>Keys &amp; Standards</option>
      <option>Blockchain &amp; Tokens</option>
      <option>DeFi &amp; Payments</option>
      <option>Exchange &amp; Chains</option>
    </select>
    <select id="f-pri" onchange="render()">
      <option value="">All priorities</option>
      <option value="高">高优先</option>
      <option value="中">中优先</option>
      <option value="低">低优先</option>
    </select>
    <select id="f-diff" onchange="render()">
      <option value="">All difficulties</option>
      <option value="beginner">Beginner</option>
      <option value="medium">Medium</option>
      <option value="expert">Expert</option>
    </select>
  </div>
  <div class="legend">
    <span style="font-size:11px;font-weight:600;color:#888">Difficulty:</span>
    <span class="legend-item"><span class="diff-dot d-b"></span>Beginner</span>
    <span class="legend-item"><span class="diff-dot d-m"></span>Medium</span>
    <span class="legend-item"><span class="diff-dot d-e"></span>Expert</span>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th style="width:68px">ID</th>
        <th style="width:210px">Article title</th>
        <th style="width:100px">Category</th>
        <th style="width:40px">Pri</th>
        <th style="width:76px">Status</th>
        <th style="width:42px">GEO</th>
        <th style="width:160px">Published URL</th>
        <th style="width:76px">Difficulty</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="footer">ELLIPAL Blog Tracker · Data saved in browser · <span id="row-count"></span></div>
</div>
<script>
const CC={'Cold Wallet Basics':'#22C55E','Security & Threats':'#F97316','Keys & Standards':'#A855F7','Blockchain & Tokens':'#3B82F6','DeFi & Payments':'#F59E0B','Exchange & Chains':'#6B7280'};
const CS={'Cold Wallet Basics':'CW','Security & Threats':'SEC','Keys & Standards':'KEYS','Blockchain & Tokens':'CHAIN','DeFi & Payments':'DEFI','Exchange & Chains':'EX'};
const CO=['Cold Wallet Basics','Security & Threats','Keys & Standards','Blockchain & Tokens','DeFi & Payments','Exchange & Chains'];
const collapsed={};CO.forEach(c=>collapsed[c]=false);
let BASE=[];
async function fetchData(){
  try{
    const r=await fetch('./data.json?t='+Date.now());
    const d=await r.json();
    BASE=d.articles;
    if(d.updated){document.getElementById('updated-time').textContent='Data updated: '+d.updated;}
  }catch(e){
    document.getElementById('tbody').innerHTML='<tr><td colspan="8" style="padding:2rem;text-align:center;color:#c00">Failed to load data.json — check deployment</td></tr>';
  }
}
let overrides={};
const SK='ellipal_tracker_v2';
function load(){
  try{const d=localStorage.getItem(SK);if(d)overrides=JSON.parse(d);}catch(e){}
  const t=localStorage.getItem(SK+'_t');
  document.getElementById('updated-time').textContent=t?'Last updated: '+t:'';
}
function save(){
  try{
    localStorage.setItem(SK,JSON.stringify(overrides));
    const n=new Date().toLocaleString();
    localStorage.setItem(SK+'_t',n);
    document.getElementById('updated-time').textContent='Last updated: '+n;
  }catch(e){}
}
function getData(){return BASE.map(a=>{const ov=overrides[a.id]||{};return{...a,...ov};});}
function runCmd(){
  const raw=document.getElementById('cmd').value.trim();
  const st=document.getElementById('cmd-st');
  if(!raw){st.textContent='Empty';return;}
  try{
    let cmds=raw.startsWith('[')?JSON.parse(raw):[JSON.parse(raw)];
    cmds.forEach(c=>{
      if(!c.id)return;
      overrides[c.id]=overrides[c.id]||{};
      if(c.status)overrides[c.id].status=c.status;
      if(c.geo!=null)overrides[c.id].geo=c.geo;
      if(c.url!=null)overrides[c.id].url=c.url;
    });
    save();render();
    st.style.color='#22C55E';st.textContent='✓ Updated '+cmds.length;
    document.getElementById('cmd').value='';
    setTimeout(()=>{st.textContent='';},3000);
  }catch(e){st.style.color='#F97316';st.textContent='JSON error';}
}
function saveUrl(id,val){overrides[id]=overrides[id]||{};overrides[id].url=val;save();}
const SM={pending:{l:'待写',c:'b-pending'},writing:{l:'写作中',c:'b-writing'},produced:{l:'已产出',c:'b-produced'},published:{l:'已发布',c:'b-published'},covered:{l:'已覆盖',c:'b-covered'},reserve:{l:'储备',c:'b-reserve'}};
const DM={beginner:{l:'Beginner',d:'d-b',t:'diff-b'},medium:{l:'Medium',d:'d-m',t:'diff-m'},expert:{l:'Expert',d:'d-e',t:'diff-e'}};
const PO={'高':0,'中':1,'低':2};
function catTag(cat){const c=CC[cat]||'#888';const s=CS[cat]||cat;return`<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:5px;background:${c}18;color:${c};font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:${c};flex-shrink:0;display:inline-block"></span>${s}</span>`;}
function toggleCat(cat){collapsed[cat]=!collapsed[cat];render();}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const fst=document.getElementById('f-status').value;
  const fcat=document.getElementById('f-cat').value;
  const fpri=document.getElementById('f-pri').value;
  const fdiff=document.getElementById('f-diff').value;
  const filtering=q||fst||fcat||fpri||fdiff;
  const data=getData();
  let filtered=data.filter(a=>{
    if(q&&!a.title.toLowerCase().includes(q)&&!a.id.toLowerCase().includes(q))return false;
    if(fst&&a.status!==fst)return false;
    if(fcat&&a.cat!==fcat)return false;
    if(fpri&&a.pri!==fpri)return false;
    if(fdiff&&a.diff!==fdiff)return false;
    return true;
  });
  filtered.sort((a,b)=>{const ci=CO.indexOf(a.cat)-CO.indexOf(b.cat);return ci!==0?ci:(PO[a.pri]||2)-(PO[b.pri]||2);});
  const groups={};CO.forEach(c=>groups[c]=[]);
  filtered.forEach(a=>{if(groups[a.cat])groups[a.cat].push(a);});
  let html='';
  CO.forEach(cat=>{
    const items=groups[cat];if(!items.length)return;
    const col=CC[cat]||'#888';
    const isCol=!filtering&&collapsed[cat];
    const nProd=items.filter(x=>['produced','published'].includes(x.status)).length;
    const nCov=items.filter(x=>x.status==='covered').length;
    let meta=`${items.length} articles`;
    if(nProd)meta+=` · ${nProd} produced`;
    if(nCov)meta+=` · ${nCov} covered`;
    html+=`<tr class="sec-row"><td colspan="8"><div class="sec-hdr" onclick="toggleCat('${cat.replace(/'/g,"\'")}')"><div class="sec-title"><span style="width:10px;height:10px;border-radius:50%;background:${col};display:inline-block;flex-shrink:0"></span>${cat}<span class="sec-meta">${meta}</span></div><span class="sec-chev ${isCol?'':'open'}">▲</span></div></td></tr>`;
    if(!isCol){
      items.forEach(a=>{
        const sm=SM[a.status]||SM.pending;
        const dm=DM[a.diff]||DM.beginner;
        const geo=a.geo!=null?`<span class="geo-val">${a.geo}</span>`:`<span style="color:#ccc">—</span>`;
        const urlVal=(a.url||'').replace(/"/g,'&quot;');
        let btn='';
        if(['pending','writing','reserve'].includes(a.status))btn=`<button class="write-btn" onclick="window.open('https://claude.ai','_blank')">Start writing ↗</button>`;
        else if(a.status==='covered')btn=`<button class="write-btn" onclick="window.open('${a.url}','_blank')">View ↗</button>`;
        const priCls={'高':'pri-high','中':'pri-mid','低':'pri-low'}[a.pri]||'pri-low';
        const rowStyle=a.status==='produced'?'background:#F0F7FF;':a.status==='published'?'background:#F0FFF4;':'';
        html+=`<tr style="${rowStyle}"><td style="font-size:11px;font-weight:600;color:#999;white-space:nowrap">${a.id}</td><td><div style="font-size:13px">${a.title}</div>${btn}</td><td>${catTag(a.cat)}</td><td><span class="${priCls}">${a.pri}</span></td><td><span class="badge ${sm.c}">${sm.l}</span></td><td>${geo}</td><td><input class="url-input" value="${urlVal}" placeholder="Add URL…" onchange="saveUrl('${a.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" /></td><td><span style="display:inline-flex;align-items:center;gap:5px;font-size:11px"><span class="diff-dot ${dm.d}"></span><span class="${dm.t}">${dm.l}</span></span></td></tr>`;
      });
    }
  });
  document.getElementById('tbody').innerHTML=html||'<tr><td colspan="8" style="padding:2rem;text-align:center;color:#bbb">No results</td></tr>';
  const all=getData();
  const total=all.length;
  document.getElementById('s-total').textContent=total;
  document.getElementById('total-count').textContent=total+' articles · 6 categories';
  document.getElementById('s-pub').textContent=all.filter(x=>x.status==='published').length;
  document.getElementById('s-prod').textContent=all.filter(x=>x.status==='produced').length;
  document.getElementById('s-cov').textContent=all.filter(x=>x.status==='covered').length;
  document.getElementById('s-hi').textContent=all.filter(x=>x.pri==='高'&&!['produced','published','covered'].includes(x.status)).length;
  document.getElementById('row-count').textContent=filtered.length+' rows shown';
}
load();fetchData().then(render);
</script>
</body>
</html>
